<html lang="es">
<head>

    <script src="js/firma.js?v=139" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP más estricta que la del servidor: aquí no hay scripts en línea,
         así que un enlace javascript: no corre. -->

    <meta name="robots" content="noindex, nofollow">
    <title>Abriendo documento…</title>
    <link rel="icon" id="v-icono" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300A1B8'/%3E%3Cpath d='M7 10.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h9a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 23.5 23h-15A1.5 1.5 0 0 1 7 21.5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 16.5h8M12 19.5h5' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/visor.css?v=139">
</head>
<body>
    <!-- Cargando o error -->
    <div id="v-estado" class="v-estado" role="status" aria-live="polite">
        <div id="v-ruedita" class="v-ruedita" aria-hidden="true"></div>
        <p id="v-estado-texto">Abriendo el documento…</p>
        <p id="v-estado-nota" class="v-estado__nota" hidden></p>
        <a id="v-estado-descargar" class="v-estado__descargar" hidden>Descargar el archivo</a>
    </div>

    <!-- Documento con su barra (js/visor.js) -->
    <div id="v-app" class="v-app" hidden></div>

    <div id="v-aviso" class="v-aviso" role="alert" hidden></div>

    <script src="js/librerias.js?v=139"></script>
    <script src="js/visor-excel.js?v=139"></script>
    <script src="js/visor.js?v=139"></script>
</body>
</html>
