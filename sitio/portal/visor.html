<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Andrés Madrid">
    <script src="js/firma.js?v=142" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP más estricta que la del servidor: aquí no hay scripts en línea,
         así que un enlace javascript: no corre. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com; base-uri 'none'; form-action 'none'">
    <meta name="robots" content="noindex, nofollow">
    <title>Abriendo documento…</title>
    <link rel="icon" id="v-icono" href="../img/legajo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/visor.css?v=142">
</head>
<body>
    <!-- Cargando o error -->
    <div id="v-estado" class="v-estado" role="status" aria-live="polite">
        <div id="v-ruedita" class="v-ruedita" aria-hidden="true"></div>
        <p id="v-estado-texto">Abriendo el documento…</p>
        <p id="v-estado-nota" class="v-estado__nota" hidden></p>
        <a id="v-estado-descargar" class="v-estado__descargar" hidden>Descargar el archivo</a>
    </div>

    <!-- Documento con su barra (js/visor.js) -->
    <div id="v-app" class="v-app" hidden></div>

    <div id="v-aviso" class="v-aviso" role="alert" hidden></div>

    <script src="js/librerias.js?v=142"></script>
    <script src="js/visor-excel.js?v=142"></script>
    <script src="js/visor.js?v=142"></script>
</body>
</html>
